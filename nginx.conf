upstream backend {
    server 127.0.0.1:7001;
}

server {
    listen 80;
    server_name app.zhoubichuan.com zhoubichuan.com; # 增加主域名支持

    # 前端静态资源 - 根路径 (app.zhoubichuan.com)
    location / {
        if ($host = 'app.zhoubichuan.com') {
            root /usr/src/zhoubichuan/prod/antdpro-express/dist;
            try_files $uri $uri/ /index.html;
            index index.html;
        }
        
        # 前端静态资源 - 子路径 (zhoubichuan.com/antdpro-demo)
        if ($host = 'zhoubichuan.com') {
            root /usr/src/zhoubichuan/prod/antdpro-demo;
        }

        gzip on;
        gzip_min_length 1k;
        gzip_comp_level 6;
        gzip_types text/css application/javascript application/json;
    }

    # 针对 /antdpro-demo 子路径的 SPA 支持
    location /antdpro-demo {
        alias /usr/src/zhoubichuan/prod/antdpro-demo;
        try_files $uri $uri/ /antdpro-demo/index.html;
        index index.html;
    }

    # 后端 API 代理
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}