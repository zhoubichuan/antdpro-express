upstream backend {
    server 127.0.0.1:7001;
}

server {
    listen 80;
    server_name zhoubichuan.com; # 主域名

    # 前端静态资源 - 动态二级路径部署 (基于项目名称: antdpro-express)
    location /antdpro-express/ {
        alias /usr/src/zhoubichuan/prod/antdpro-express/dist/;
        try_files $uri $uri/ /antdpro-express/index.html; # SPA 路由支持
        index index.html;
        
        gzip on;
        gzip_min_length 1k;
        gzip_comp_level 6;
        gzip_types text/css application/javascript application/json;
    }

    # 后端 API 代理 - 动态二级路径转发
    location /antdpro-express/api/ {
        rewrite ^/antdpro-express/api/(.*)$ /api/$1 break; # 去除前缀转发给后端
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}