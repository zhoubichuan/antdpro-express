upstream backend {
    server 127.0.0.1:7001;
}

server {
    listen 80;
    server_name zhoubichuan.com; # 主域名

    # 前端静态资源 - antdpro-demo (前端项目)
    # 修正：服务器上代码直接部署在 antdpro-demo 根目录，无 dist 子目录
    location /antdpro-demo/ {
        alias /usr/src/zhoubichuan/prod/antdpro-demo/;
        try_files $uri $uri/ /antdpro-demo/index.html; # SPA 路由支持
        index index.html;
        
        gzip on;
        gzip_min_length 1k;
        gzip_comp_level 6;
        gzip_types text/css application/javascript application/json;
    }

    # 后端 API 代理 - antdpro-express (后端项目)
    location /antdpro-express/api/ {
        rewrite ^/antdpro-express/api/(.*)$ /api/$1 break; # 去除前缀转发给后端
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}