server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/zhoubichuan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhoubichuan.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_name zhoubichuan.com;

    # Todo Rust 后端 API 代理
    location ^~/todo-rust/api/ {
        rewrite ^/todo-rust/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin * always;
        if ($request_method = 'OPTIONS') { return 204; }
    }

    # Todo 前端应用
    location ^~/todo/ {
        root /usr/src/zhoubichuan/prod;
        try_files $uri $uri/ /todo/index.html;
        index index.html index.htm;
    }

    # antdpro-demo frontend (核心修复：指向无 dist 的根目录)
    location = /antdpro-demo {
        return 301 /antdpro-demo/;
    }
    
    location ^~/antdpro-demo/ {
        alias /usr/src/zhoubichuan/prod/antdpro-demo/;
        try_files $uri $uri/ /antdpro-demo/index.html;
        index index.html;
        gzip on;
        gzip_min_length 1k;
        gzip_comp_level 6;
        gzip_types text/css application/javascript application/json;
    }

    # antdpro-demo API proxy (新增：转发前端 API 请求到后端服务)
    location ^~/antdpro-demo/api/ {
        rewrite ^/antdpro-demo/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:7001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # antdpro-express API proxy
    location ^~/antdpro-express/api/ {
        rewrite ^/antdpro-express/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:7001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}